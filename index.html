<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ahsnccu Atlas Application</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    
    <link rel="stylesheet" href="styles.css">
    
    <link rel="icon" type="image/png" href="AAA_icon.png">

    <link rel="apple-touch-icon" href="AAA_icon.png">

    <link rel="shortcut icon" href="AAA_icon.png">

    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

    <div class="grid-wrapper">
        <div class="grid-background"></div>
    </div>

    <div id="map"></div>

    <div class="main-wrapper">
    <label class="main" for="menu-toggle">
            Menu
            <div class="bar">
                <span class="top bar-list"></span>
                <span class="middle bar-list"></span>
                <span class="bottom bar-list"></span>
            </div>
        </label>
        
        <input class="inp" type="checkbox" id="menu-toggle" checked>

        <section class="menu-container">
            <div id="ui-container">
                
                <img src="AAA.png" alt="Logo" style="display: block; margin: 0 auto 15px auto; width: 100%; height: auto;">

                <div style="margin-bottom: 10px;">
                    <label style="font-size: 13px; color: #ffffff;">起點:</label>
                    <div style="display: flex; gap: 5px; align-items: center; width: 100%;">
                        <select id="start-select" style="flex-grow: 1; width: auto; height: 36px;"></select>
                        
                        <button id="live-view-btn" title="Open Live View" style="background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%); border: none; border-radius: 4px; padding: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 40px; flex-shrink: 0; margin-left: 5px;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                <circle cx="12" cy="13" r="4"></circle>
                            </svg>
                        </button>
                    </div>
                    
                    <label style="font-size: 13px; color: #ffffff;">終點:</label>
                    <select id="end-select" style="width: 100%;"></select>
                </div>

                <label class="toggle-container">
                    <input type="checkbox" class="toggle-input" id="elev-toggle">
                    <div class="toggle-track">
                        <svg class="icon icon-unlocked" viewBox="0 0 512 512">
                            <path d="M164.88,236.37c-11.79,0 -21.34,9.55 -21.34,21.34c0,11.79 9.55,21.34 21.34,21.34c11.79,0 21.35,-9.55 21.35,-21.34C186.23,245.92 176.67,236.37 164.88,236.37z"></path>
                            <path d="M256.01,236.37c-11.79,0 -21.35,9.55 -21.35,21.34c0,11.79 9.56,21.34 21.35,21.34c11.78,0 21.35,-9.55 21.35,-21.34C277.36,245.92 267.79,236.37 256.01,236.37z"></path>
                            <path d="M347.13,236.37c-11.79,0 -21.35,9.55 -21.35,21.34c0,11.79 9.56,21.34 21.35,21.34c11.79,0 21.35,-9.55 21.35,-21.34C368.48,245.92 358.92,236.37 347.13,236.37z"></path>
                            <path d="M395.78,134.78H116.23c-21.48,0 -38.97,17.48 -38.97,38.96v299.3c0,21.49 17.49,38.97 38.97,38.97h279.55c21.48,0 38.96,-17.48 38.96,-38.97V173.74C434.74,152.26 417.26,134.78 395.78,134.78zM161.08,487.41l3.8,-85.56l3.8,85.56H161.08zM252.2,487.41l3.81,-85.56l3.8,85.56H252.2zM343.32,487.41l3.81,-85.56l3.81,85.56H343.32zM410.15,473.03c0,7.93 -6.45,14.38 -14.37,14.38h-25.22l0.69,-99.89c1.57,2.3 4.15,3.85 7.14,3.71c4.58,-0.22 8.12,-4.11 7.9,-8.69l3.54,-71.05c0,-27.95 -28.32,-29.32 -42.71,-29.32c-14.4,0 -42.71,1.38 -42.71,29.32l2.38,71.05c-0.21,4.59 3.32,8.48 7.9,8.69c4.01,0.19 7.33,-2.56 8.29,-6.29l0.7,102.47h-44.24l0.69,-99.89c1.57,2.3 4.16,3.85 7.15,3.71c4.58,-0.22 8.12,-4.11 7.91,-8.69l3.53,-71.05c0,-27.95 -28.32,-29.32 -42.71,-29.32c-14.41,0 -42.72,1.38 -42.72,29.32l2.38,71.05c-0.21,4.59 3.32,8.48 7.91,8.69c4.01,0.19 7.34,-2.57 8.29,-6.31l0.7,102.49h-44.24l0.68,-99.89c1.57,2.3 4.16,3.85 7.15,3.71c4.59,-0.22 8.11,-4.11 7.9,-8.69l3.54,-71.05c0,-27.95 -28.31,-29.32 -42.71,-29.32c-14.39,0 -42.71,1.38 -42.71,29.32l2.37,71.05c-0.22,4.59 3.32,8.48 7.9,8.69c4.02,0.19 7.35,-2.57 8.29,-6.31l0.7,102.49h-25.22c-7.93,0 -14.38,-6.45 -14.38,-14.38V173.74c0,-7.92 6.45,-14.37 14.38,-14.37h279.55c7.92,0 14.37,6.45 14.37,14.37V473.03z"></path>
                            <path d="M283.93,70.74l29.21,-29.21v65.67c0,5.99 4.86,10.84 10.85,10.84c5.99,0 10.86,-4.85 10.86,-10.84V41.53l29.21,29.21c2.13,2.12 4.9,3.18 7.67,3.18c2.78,0 5.56,-1.06 7.67,-3.18c4.24,-4.24 4.24,-11.1 0,-15.33L331.66,7.67L323.98,0l-7.67,7.67l-47.73,47.74c-4.24,4.23 -4.24,11.1 0,15.33C272.82,74.98 279.7,74.98 283.93,70.74z"></path>
                            <path d="M180.35,114.87c0,0.01 0,0.01 0,0.01l7.67,7.67l7.67,-7.67c0,0 0.01,0 0.01,-0.01l47.72,-47.73c4.24,-4.24 4.24,-11.11 0,-15.34c-4.22,-4.24 -11.1,-4.24 -15.33,0l-29.21,29.22V15.34c0,-5.99 -4.86,-10.85 -10.86,-10.85c-5.98,0 -10.84,4.85 -10.84,10.85v65.67L147.96,51.8c-4.23,-4.24 -11.1,-4.24 -15.34,0c-4.24,4.23 -4.24,11.1 0,15.34L180.35,114.87z"></path>
                        </svg>
                        <svg class="icon icon-locked" viewBox="0 0 512 512">
                            <path d="M311.24,83.45l0,142.46l-170.66,0l0,142.44l-140.57,0l0,60.19l200.76,0l0,-142.46l170.66,0l0,-142.46l140.58,0l0,-60.18z"></path>
                        </svg>
                    </div>
                </label>

                <button id="start-btn" class="btn">
                    <div>START</div>
                    <svg fill="none" viewBox="0 0 24 24" height="25px" width="25px" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linejoin="round" stroke-linecap="round" stroke-miterlimit="10" stroke-width="2" stroke="white" d="M11.6801 14.62L14.2401 12.06L11.6801 9.5"></path>
                        <path stroke-linejoin="round" stroke-linecap="round" stroke-miterlimit="10" stroke-width="2" stroke="white" d="M4 12.0601H14.17"></path>
                        <path stroke-linejoin="round" stroke-linecap="round" stroke-miterlimit="10" stroke-width="2" stroke="white" d="M12 4C16.42 4 20 7 20 12C20 17 16.42 20 12 20"></path>
                    </svg>
                </button>
                <p class="status" id="status-text">地圖已載入，請選擇起點與終點。</p>
                <button id="share-btn" class="cta">
                    <span>分享此路徑</span>
                    <svg width="15px" height="10px" viewBox="0 0 13 10">
                        <path d="M1,5 L11,5"></path>
                        <polyline points="8 1 12 5 8 9"></polyline>
                    </svg>
                </button>
            </div>
        </section>
    </div>

    <div id="zoom-indicator">
        <span id="zoom-value">0%</span>
    </div>

    <div id="flag-button-container">
        <button id="flag-action-btn" class="flag-button-container-btn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path fill-rule="evenodd" d="M12,2 C16.9705627,2 21,5.98572446 21,10.9023647 C21,14.1558559 18.2776716,17.5957933 12.9482526,21.3431516 L12,22 L11.4277959,21.6050955 C5.85042064,17.7558913 3,14.2315185 3,10.9023647 C3,5.98572446 7.02943725,2 12,2 Z M12,3.97830328 C8.13400675,3.97830328 5,7.07831119 5,10.9023647 C5,13.3048538 7.29671943,16.236445 12,19.5818284 C16.7032806,16.236445 19,13.3048538 19,10.9023647 C19,7.07831119 15.8659932,3.97830328 12,3.97830328 Z M12,6 C14.209139,6 16,7.790861 16,10 C16,12.209139 14.209139,14 12,14 C9.790861,14 8,12.209139 8,10 C8,7.790861 9.790861,6 12,6 Z M12,8 C10.8954305,8 10,8.8954305 10,10 C10,11.1045695 10.8954305,12 12,12 C13.1045695,12 14,11.1045695 14,10 C14,8.8954305 13.1045695,8 12,8 Z"></path> </g></svg>
        </button>
    </div>

    <div id="play-button-container">
        <button id="play-action-btn" class="play-button-container-btn">
           <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M21.4086 9.35258C23.5305 10.5065 23.5305 13.4935 21.4086 14.6474L8.59662 21.6145C6.53435 22.736 4 21.2763 4 18.9671L4 5.0329C4 2.72368 6.53435 1.26402 8.59661 2.38548L21.4086 9.35258Z"></path> </g></svg>
        </button>
    </div>
    

    <div id="dev-hud" style="
        display: none; 
        position: absolute; 
        top: 20px; 
        right: 20px; 
        background: rgba(0, 0, 0, 0.85); 
        color: #00ffcc; 
        padding: 15px; 
        font-family: monospace; 
        font-size: 12px; 
        border-radius: 8px; 
        z-index: 9999;
        border: 1px solid #00ffcc;
    ">
        <div style="margin-bottom: 10px; font-weight: bold; text-align: center;">DEV MODE ACTIVE</div>
            <div style="display: grid; grid-template-columns: 70px 1fr; gap: 5px; align-items: center;">
                <span>Lng:</span><input type="text" id="hud-lng" readonly style="background:transparent; border:none; color:#fff; width:100px;">
                <span>Lat:</span><input type="text" id="hud-lat" readonly style="background:transparent; border:none; color:#fff; width:100px;">
                <span>Pitch:</span><input type="text" id="hud-pitch" readonly style="background:transparent; border:none; color:#fff; width:100px;">
                <span>Zoom:</span><input type="text" id="hud-zoom" readonly style="background:transparent; border:none; color:#fff; width:70px;">
                <span>Bear:</span><input type="text" id="hud-bear" readonly style="background:transparent; border:none; color:#fff; width:100px;">
                <span>Alt:</span><input type="text" id="hud-alt" readonly style="background:transparent; border:none; color:#ff9900; font-weight:bold; width:70px;">
            </div>
        <div style="margin-top: 10px; font-size: 10px; color: #888;">Click values to highlight & Ctrl+C</div>
    </div>

    <div id="pano-modal" style="display: none;">
        <div class="pano-content">
            <button id="close-pano" onclick="closePanorama()">×</button>
            <div id="panorama-container"></div>
            <div id="pano-title">Location Name</div>
        </div>
    </div>

    <div id="camera-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 10000;">
        <video id="webcam" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
        <canvas id="snapshot" style="display: none;"></canvas>
        
        <div class="ar-vignette"></div>

        <div class="ar-guidance-container">
            <div class="ar-ring"></div>
            <div class="ar-hint-box">
                <div class="ar-arrow">↑</div>
                <span id="camera-status">請將相機對準周圍的建築物。</span>
            </div>
        </div>

        <div id="camera-status" class="camera-status-container">
            <span class="status-text">維修中，暫不開放此功能</span>
        </div>
        
        <button id="close-camera">×</button>
    </div>

    <div id="share-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button class="close-btn" onclick="closeShareModal()">&times;</button>
            <h3>分享路線</h3>
            
            <div id="qrcode-container"></div>
            
            <p class="instruction">掃描 QR Code 或複製下方連結</p>

            <div class="link-copy-wrapper">
                <input type="text" id="modal-url-input" readonly>
                <button id="modal-copy-btn" onclick="copyFromModal()">COPY LINK</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script src="main.js"></script>
    
    <div id="site-credit">政附19屆 123 林子宸、鄭宇宸、鄭宇翔、陳諒平</div>
</body>
</html>
